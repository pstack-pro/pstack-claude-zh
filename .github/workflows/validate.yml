name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch pinned upstream pstack
        run: |
          commit=$(node -p 'require("./UPSTREAM.json").commit')
          git clone --quiet https://github.com/cursor/plugins.git "$RUNNER_TEMP/plugins"
          git -C "$RUNNER_TEMP/plugins" checkout --quiet "$commit"

      - run: node scripts/validate-zh.mjs
        env:
          PSTACK_SRC: ${{ runner.temp }}/plugins/pstack
